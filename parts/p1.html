<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--navy:#061426;--navy2:#0C2038;--navy3:#12294A;
--org:#FF6A00;--org-d:#E05E00;--org-soft:#FFF1E5;
--bg:#F4F6F9;--card:#fff;--ink:#101B29;--ink2:#33445A;--mut:#64748A;
--line:#E4E9F0;--line2:#EFF2F6;
--green:#16A34A;--red:#DC2626;--gold:#F5A623;
--max:1280px;--padx:clamp(20px,4vw,56px);
--r:18px;--r-lg:24px;
--sh:0 24px 50px -28px rgba(6,20,38,.28);
}
html{scroll-behavior:smooth}
body{font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:2;overflow-x:hidden;font-size:15px}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.wrap{padding-inline:var(--padx);max-width:var(--max);margin-inline:auto}
.sec{padding:76px 0}
.sec.white{background:#fff}
.shead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}
.shead h2{font-size:clamp(21px,2.6vw,29px);font-weight:900;display:flex;align-items:center;gap:12px}
.shead h2::before{content:"";width:26px;height:4px;border-radius:4px;background:var(--org);flex:none}
.shead a.more{font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.shead a.more:hover{color:var(--org-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:800;border-radius:14px;padding:13px 30px;font-size:14.5px;cursor:pointer;transition:.2s;border:1px solid transparent;font-family:inherit;line-height:1.8}
.btn-o{background:var(--org);color:#fff}
.btn-o:hover{background:var(--org-d)}
.btn-g{border-color:rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.06)}
.btn-g:hover{border-color:#fff}
.btn-w{border-color:var(--line);color:var(--ink);background:#fff}
.btn-w:hover{border-color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--org);outline-offset:2px}
::selection{background:#FFE3C7}
#toast{position:fixed;bottom:26px;right:50%;transform:translate(50%,14px);background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;padding:11px 26px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translate(50%,0)}
@media(max-width:900px){.sec{padding:54px 0}}
/* ===== HEADER (single row) ===== */
.hdr{background:var(--navy);color:#fff;position:sticky;top:0;z-index:60}
.hdr-in{display:flex;align-items:center;gap:20px;max-width:var(--max);margin-inline:auto;padding:13px var(--padx)}
.logo{display:flex;align-items:center;gap:11px;white-space:nowrap}
.logo .mk{width:42px;height:42px;border-radius:12px;background:var(--org);display:grid;place-items:center;flex:none}
.logo b{font-size:20px;font-weight:900;display:block;line-height:1.5}
.logo small{font-size:10.5px;color:var(--org);display:block;line-height:1.6}
.hnav{display:flex;gap:26px;margin-inline:auto}
.hnav a{font-size:14px;font-weight:600;color:#C7D2E0;padding:6px 2px;white-space:nowrap;border-bottom:2.5px solid transparent}
.hnav a:hover{color:#fff}
.hnav a.on{color:#fff;border-color:var(--org)}
.hacts{display:flex;align-items:center;gap:2px}
.hicon{position:relative;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:#E6EDF5;display:grid;place-items:center;cursor:pointer;font-family:inherit;transition:.2s}
.hicon:hover{background:rgba(255,255,255,.1);color:#fff}
.hicon .bdg{position:absolute;top:2px;left:2px;background:var(--org);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 5px;font-style:normal}
.burger{display:none}
.searchdrop{display:none;border-top:1px solid rgba(255,255,255,.1)}
.searchdrop.open{display:block}
.searchdrop form{display:flex;gap:10px;max-width:var(--max);margin-inline:auto;padding:12px var(--padx)}
.searchdrop input{flex:1;border:0;outline:0;border-radius:12px;padding:12px 20px;font-family:inherit;font-size:14px;min-width:0;color:var(--ink)}
.mnav{display:none;border-top:1px solid rgba(255,255,255,.1);padding:6px var(--padx) 14px}
.mnav.open{display:block}
.mnav a{display:block;padding:11px 4px;font-weight:700;font-size:14.5px;color:#E6EDF5;border-bottom:1px solid rgba(255,255,255,.08)}
.mnav a:last-child{border:0}
@media(max-width:1100px){.hnav{display:none}.burger{display:grid}}
