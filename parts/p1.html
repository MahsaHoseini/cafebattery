<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--navy:#061426;--navy2:#0C2038;--navy3:#12294A;
--org:#FF6A00;--org-d:#E05E00;--org-soft:#FFF1E5;
--bg:#F4F6F9;--card:#fff;--ink:#101B29;--ink2:#33445A;--mut:#64748A;
--line:#E4E9F0;--line2:#EFF2F6;
--green:#16A34A;--red:#DC2626;--gold:#F5A623;
--max:1280px;--padx:clamp(20px,4vw,56px);
--r:18px;--r-lg:24px;
--sh:0 24px 50px -28px rgba(6,20,38,.28);
}
html{scroll-behavior:smooth}
body{font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:2;overflow-x:hidden;font-size:15px}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.wrap{padding-inline:var(--padx);max-width:var(--max);margin-inline:auto}
.sec{padding:76px 0}
.sec.white{background:#fff}
.shead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}
.shead h2{font-size:clamp(21px,2.6vw,29px);font-weight:900;display:flex;align-items:center;gap:12px}
.shead h2::before{content:"";width:26px;height:4px;border-radius:4px;background:var(--org);flex:none}
.shead a.more{font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.shead a.more:hover{color:var(--org-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:800;border-radius:14px;padding:13px 30px;font-size:14.5px;cursor:pointer;transition:.2s;border:1px solid transparent;font-family:inherit;line-height:1.8}
.btn-o{background:var(--org);color:#fff}
.btn-o:hover{background:var(--org-d)}
.btn-g{border-color:rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.06)}
.btn-g:hover{border-color:#fff}
.btn-w{border-color:var(--line);color:var(--ink);background:#fff}
.btn-w:hover{border-color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--org);outline-offset:2px}
::selection{background:#FFE3C7}
#toast{position:fixed;bottom:26px;right:50%;transform:translate(50%,14px);background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;padding:11px 26px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translate(50%,0)}
@media(max-width:900px){.sec{padding:54px 0}}
/* ===== HEADER ===== */
.hdr{background:var(--navy);color:#fff}
.hdr-top{display:flex;align-items:center;gap:22px;max-width:var(--max);margin-inline:auto;padding:16px var(--padx)}
.logo{display:flex;align-items:center;gap:11px;white-space:nowrap}
.logo .mk{width:44px;height:44px;border-radius:13px;background:var(--org);display:grid;place-items:center;flex:none}
.logo b{font-size:21px;font-weight:900;display:block;line-height:1.5}
.logo small{font-size:11px;color:var(--org);display:block;line-height:1.6}
.hsearch{flex:1;display:flex;align-items:center;background:#fff;border-radius:14px;padding:5px 18px 5px 5px;max-width:560px;margin-inline:auto}
.hsearch svg{flex:none;margin-left:10px}
.hsearch input{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:13.5px;color:var(--ink);min-width:0;padding:10px 0}
.hsearch button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 24px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
.hacts{display:flex;align-items:center;gap:4px}
.hact{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#C7D2E0;padding:8px 13px;border-radius:12px;border:0;background:transparent;font-family:inherit;cursor:pointer;white-space:nowrap}
.hact:hover{background:rgba(255,255,255,.08);color:#fff}
.hact .bdg{position:absolute;top:0;left:6px;background:var(--org);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 5px;font-style:normal}
.hact.tel{flex-direction:row;gap:9px;font-size:13px}
.hact.tel b{font-size:16px;letter-spacing:.3px}
.hnav{border-top:1px solid rgba(255,255,255,.1)}
.hnav-in{display:flex;gap:30px;max-width:var(--max);margin-inline:auto;padding:0 var(--padx);overflow-x:auto;scrollbar-width:none}
.hnav-in::-webkit-scrollbar{display:none}
.hnav a{font-size:14px;font-weight:600;color:#C7D2E0;padding:13px 2px;white-space:nowrap;border-bottom:2.5px solid transparent}
.hnav a:hover{color:#fff}
.hnav a.on{color:#fff;border-color:var(--org)}
@media(max-width:1100px){.hact.tel div{display:none}}
@media(max-width:900px){
.hdr-top{flex-wrap:wrap;gap:12px}
.hsearch{order:3;flex-basis:100%;max-width:none}
.hact{font-size:0;padding:8px}
.hact.tel{font-size:0}
.hact .bdg{font-size:10px}
}
</style>
